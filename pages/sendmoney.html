<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Enviar Dinero</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="../assets/css/styles.css">

</head>

<body>

<div class="container mt-5">

  <div class="card p-4 wallet-card">

    <h2>Enviar Dinero</h2>

    <input
      type="text"
      id="searchContact"
      class="form-control mb-3"
      placeholder="Buscar contacto"
    >

    <ul id="contactList" class="list-group mb-3"></ul>

    <button
      id="showFormBtn"
      class="btn btn-secondary mb-3"
    >
      Agregar nuevo contacto
    </button>

    <div id="contactForm" style="display:none;">

      <input id="name" class="form-control mb-2" placeholder="Nombre y apellido">

      <input id="cbu" class="form-control mb-2" placeholder="CBU">

      <input id="alias" class="form-control mb-2" placeholder="Alias">

      <input id="bank" class="form-control mb-2" placeholder="Banco">

      <button id="saveContact" class="btn btn-success">
        Guardar
      </button>

      <button id="cancelBtn" class="btn btn-danger">
        Cancelar
      </button>

    </div>

    <input
      type="number"
      id="sendAmount"
      class="form-control mt-4"
      placeholder="Monto a enviar"
    >

    <button
      id="sendMoneyBtn"
      class="btn btn-warning mt-3"
      style="display:none;"
    >
      Enviar dinero
    </button>

    <div id="messageContainer" class="mt-3"></div>

  </div>

</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="../assets/js/app.js"></script>
<script src="../assets/js/contacts.js"></script>

</body>
</html>
